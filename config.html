<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay Config</title>
  <!-- Same font as the overlay so the config page matches the overall aesthetic -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Dark background matching the overlay style */
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Rajdhani', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Centered card with the same red top border as the ticker bar */
    .panel {
      background: rgba(8, 8, 12, 0.98);
      border-top: 3px solid #da292a;
      padding: 36px 44px 32px;
      width: 440px;
      border-radius: 4px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    h1 span { color: #da292a; }

    /* Small uppercase label above each input field */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #111118;
      border: 1px solid #222;
      border-radius: 3px;
      color: #fff;
      font-family: 'Rajdhani', Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      padding: 10px 12px;
      margin-bottom: 22px;
      outline: none;
      transition: border-color 0.15s;
    }
    /* Red border glow when an input is focused */
    input:focus { border-color: #da292a; }

    /* Side-by-side layout for the Your Team and Scroll Speed fields */
    .row { display: flex; gap: 14px; }
    .row .field { flex: 1; }

    /* Toggle switch row for boolean settings like Match Point Mode */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .toggle-row label:first-child {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #222;
      border: 1px solid #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .toggle-slider { background: #da292a; border-color: #da292a; }
    input:checked + .toggle-slider:before { transform: translateX(20px); background: #fff; }

    button {
      width: 100%;
      background: #da292a;
      border: none;
      border-radius: 3px;
      color: #fff;
      font-family: 'Rajdhani', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #bf2122; }

    /* "Saved!" confirmation that briefly appears after clicking Save */
    #status {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4caf50;
      margin-top: 14px;
      height: 18px;
    }

    /* Reminder text at the bottom about refreshing OBS */
    .hint {
      font-size: 12px;
      color: #3a3a44;
      margin-top: 22px;
      line-height: 1.7;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Overlay <span>Config</span></h1>

    <!-- The Twitch channel whose chat the overlay listens to -->
    <label>Twitch Channel</label>
    <input id="channel" type="text" placeholder="verhulst" spellcheck="false">

    <div class="row">
      <div class="field">
        <!-- The primary team name to highlight in the ticker (e.g. 100T) -->
        <label>Your Team</label>
        <input id="yourTeam" type="text" placeholder="100T" spellcheck="false">
      </div>
      <div class="field">
        <!-- How fast the ticker scrolls — higher number = faster. Default is 85. -->
        <label>Scroll Speed</label>
        <input id="scrollPps" type="number" placeholder="85" min="20" max="300">
      </div>
    </div>

    <!-- Any other names the team goes by that should also get the highlight treatment.
         Enter as a comma-separated list, e.g: CRT, ALT -->
    <label>Team Aliases <span style="color:#444;font-size:10px;letter-spacing:1px">(comma separated)</span></label>
    <input id="aliases" type="text" placeholder="CRT, ALT" spellcheck="false">

    <!-- Toggle whether to show the MP badge and gold border for teams at 50+ points.
         Turn off for tournaments that don't use match point rules. -->
    <div class="toggle-row">
      <label>Match Point Mode</label>
      <label class="toggle">
        <input type="checkbox" id="matchPoint">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <button onclick="save()">Save & Apply</button>
    <div id="status"></div>
    <!-- Settings are saved to the browser's localStorage. After saving, refresh
         the OBS browser source so the overlay picks up the new values. -->
    <p class="hint">After saving, refresh the overlay browser source in OBS to apply changes.</p>
  </div>

  <script>
    // Fallback values used when a field is left blank
    const DEFAULTS = { channel: 'verhulst', yourTeam: '100T', scrollPps: 85, aliases: ['CRT'], matchPoint: false };

    // Reads saved settings from localStorage and pre-fills the form fields.
    // Called automatically when the page loads so you always see the current config.
    function load() {
      const cfg = JSON.parse(localStorage.getItem('scrim-config') || '{}');
      document.getElementById('channel').value   = cfg.channel   || DEFAULTS.channel;
      document.getElementById('yourTeam').value  = cfg.yourTeam  || DEFAULTS.yourTeam;
      document.getElementById('scrollPps').value = cfg.scrollPps || DEFAULTS.scrollPps;
      // Join the aliases array back into a comma-separated string for display
      document.getElementById('aliases').value   = (cfg.aliases  || DEFAULTS.aliases).join(', ');
      document.getElementById('matchPoint').checked = cfg.matchPoint ?? DEFAULTS.matchPoint;
    }

    // Reads the form, validates it, and writes the config to localStorage.
    // The overlay reads from localStorage each time it loads, so refreshing OBS applies the changes.
    function save() {
      // Split the aliases field on commas, strip whitespace, and uppercase each entry
      const rawAliases = document.getElementById('aliases').value;
      const aliases = rawAliases.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

      const cfg = {
        channel:   document.getElementById('channel').value.trim()  || DEFAULTS.channel,
        yourTeam:  (document.getElementById('yourTeam').value.trim() || DEFAULTS.yourTeam).toUpperCase(),
        scrollPps: parseInt(document.getElementById('scrollPps').value) || DEFAULTS.scrollPps,
        aliases,
        matchPoint: document.getElementById('matchPoint').checked,
      };

      localStorage.setItem('scrim-config', JSON.stringify(cfg));

      // Show a brief "Saved!" confirmation then clear it after 2 seconds
      const el = document.getElementById('status');
      el.textContent = 'Saved!';
      setTimeout(() => el.textContent = '', 2000);
    }

    // Pre-fill the form on page load

    load();
  </script>
</body>
</html>
